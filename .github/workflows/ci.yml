name: ci-checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root:
          - Infrastructure/terraform/azure
    defaults:
      run:
        working-directory: ${{ matrix.root }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.15"

      - name: Formatting
        working-directory: Infrastructure/terraform
        run: terraform fmt -check -recursive -diff

      # The config reads an SSH public key from disk; the runner has none, so make a throwaway one
      - name: Generate throwaway SSH key
        run: |
          ssh-keygen -t ed25519 -N "" -q -f "$RUNNER_TEMP/ci_key"
          echo "TF_VAR_admin_ssh_public_key_path=$RUNNER_TEMP/ci_key.pub" >> "$GITHUB_ENV"

      - name: Init
        run: terraform init -backend=false -input=false

      - name: Validate
        run: terraform validate

  app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: app/requirements*.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements.txt -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest

  ansible:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install linters
        run: pip install ansible-lint==26.9.0 yamllint==1.38.0

      - name: Install collections
        working-directory: Infrastructure/ansible
        run: ansible-galaxy collection install -r requirements.yml

      - name: YAML lint
        run: yamllint .

      - name: Ansible lint
        working-directory: Infrastructure/ansible
        run: ansible-lint

  checkov:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Checkov
        run: pip install checkov==3.3.22

      # One -o per format: the CLI report goes to the log, the SARIF report to a file
      - name: Checkov scan
        run: >-
          checkov --directory . --quiet
          --framework terraform,dockerfile,github_actions
          -o cli -o sarif --output-file-path console,results.sarif

      # Checkov writes checks skipped with a checkov:skip comment into the SARIF as suppressed
      # results, and GitHub opens an alert for them anyway. Drop them before the upload.
      - name: Remove skipped checks from SARIF
        if: success() || failure()
        run: >-
          jq '.runs[].results |= map(select((.suppressions // []) | length == 0))'
          results.sarif > results.filtered.sarif

      # Runs when the scan fails too, so the findings still reach the Security tab
      - name: Upload SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: results.filtered.sarif
          category: checkov

  semgrep:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install Semgrep
        run: pip install semgrep==1.179.0

      - name: Semgrep scan
        run: >-
          semgrep scan --error --metrics=off
          --config p/python --config p/dockerfile
          --config p/terraform --config p/github-actions
          --sarif --output semgrep.sarif

      - name: Upload SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  gitleaks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Full history: a secret removed in a later commit is still in the repo
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Gitleaks scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # No PR comments (needs write access) and no report artifact:
          # on a public repo the artifact would publish the secret it found
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false

  # Known CVEs in the pinned Python dependencies; the built image is scanned in image.yml
  trivy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # In SARIF mode the action reports every severity unless limit-severities-for-sarif is set
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: app
          severity: MEDIUM,HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy-fs.sarif
          limit-severities-for-sarif: true

      - name: Upload SARIF
        if: success() || failure()
        uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs
